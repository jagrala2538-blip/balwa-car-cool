<style>
:root{--bg:#f2f6fb;--card:#fff;--tx:#14233a;--mu:#5b6b82;--bd:#d9e2ee;--pr:#1d3f9e;--ac:#f26a1b;--ok:#13894b;--rd:#d12f2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--card:#17212f;--tx:#e8eef7;--mu:#9aabc2;--bd:#2a3a50}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(90deg,#0d1a3d,#18306b);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header img{height:46px;border-radius:6px}header b{font-size:18px;flex:1}
nav{display:flex;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{flex:0 0 auto;border:0;background:none;color:var(--tx);padding:12px 14px;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--pr);border-color:var(--ac);font-weight:700}
main{padding:14px;max-width:1000px;margin:auto}h2{margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);font-weight:600}
input,select,textarea{width:100%;padding:9px;margin-top:3px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn.or{background:var(--ac)}.btn.ghost{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:5px 9px;font-size:12px}.btn.rd{background:var(--rd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.st{border-radius:12px;padding:14px;color:#fff;background:var(--pr)}.st:nth-child(2){background:var(--ok)}.st:nth-child(3){background:var(--ac)}.st:nth-child(4){background:var(--rd)}.st:nth-child(5){background:#6b3fb0}
.st small{opacity:.9;display:block}.st b{font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;overflow:auto;padding:14px}.modal[hidden]{display:none}
.mbox{background:var(--card);max-width:520px;margin:20px auto;padding:16px;border-radius:12px}.mbox.w{max-width:820px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#14233a;color:#fff;padding:10px 18px;border-radius:20px;z-index:99;display:none}
.neg{color:var(--rd)}.pos{color:var(--ok)}.x{text-decoration:line-through;opacity:.5}
#login{max-width:360px;margin:12vh auto;padding:20px}
@media print{body>*:not(#mod){display:none!important}#mod{position:static;background:none;padding:0}.mbox{box-shadow:none;margin:0;max-width:none;padding:0}.noprint{display:none!important}}
input,select,textarea{font-size:16px}.btn{min-height:42px}.btn.sm{min-height:36px;padding:7px 12px;font-size:13px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.ic{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}.amt{padding:10px 0;font-weight:700}
.mbox label{margin-top:8px}nav button span{margin-right:4px}
@media(max-width:700px){nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:2px solid var(--bd);border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:7px 12px;border-bottom:0;border-top:3px solid transparent}nav button span{font-size:20px;margin:0}main{padding:12px 12px 100px}.st b{font-size:18px}header b{font-size:15px}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;margin-top:10px;max-height:290px;overflow:auto}
.pc{border:2px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;background:var(--bg);text-align:center;user-select:none}.pc:active{border-color:var(--ac);background:var(--card)}.pc.out{opacity:.45;cursor:not-allowed}
.qty{display:flex;gap:4px;margin-top:3px}.qty button{width:40px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font-size:20px}.qty input{margin:0;text-align:center;padding:6px;min-width:0}
.ic .g3{grid-template-columns:1fr 1fr}
.bill td,.bill th{white-space:normal;border-bottom:0}.bill th{color:#fff;text-transform:none;font-size:13px}.bill table{table-layout:auto}
@media print{*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}@page{size:A4;margin:8mm}}

const fbErr=e=>toast('Sync error: '+(e.message||e));
function put(col,o){const a=db[col],i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;if(fs)fs.collection(col).doc(o.id).set(o).catch(fbErr);else save()}
function rmv(col,id){db[col]=db[col].filter(x=>x.id!==id);if(fs)fs.collection(col).doc(id).delete().catch(fbErr);else save()}
function upd(col,id,f){const o=db[col].find(x=>x.id===id);if(o)Object.assign(o,f);if(fs)fs.collection(col).doc(id).update(f).catch(fbErr);else save()}
function addIn(id,x){const p=db.products.find(p=>p.id===id);p.ins=p.ins||[];p.ins.push(x);if(fs)fs.collection('products').doc(id).update({ins:firebase.firestore.FieldValue.arrayUnion(x)}).catch(fbErr);else save()}

async function nextNo(){if(!fs)return db.seq++;const r=fs.doc('meta/counter');return fs.runTransaction(async t=>{const d=await t.get(r),n=(d.exists?d.data().n:0)+1;t.set(r,{n});return n})}
function initFB(){if(!FIREBASE_CONFIG||typeof firebase==='undefined')return;try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){fs=null;auth=null}}

 COLS.forEach(c=>unsubs.push(fs.collection(c).onSnapshot(sn=>{db[c]=sn.docs.map(d=>d.data());got(c)},fbErr)));
 unsubs.push(fs.doc('meta/shop').onSnapshot(d=>{if(d.exists)Object.assign(db.shop,d.data());if(!db.shop.logo||/^data:image\/jpeg/.test(db.shop.logo))db.shop.logo=DEFLOGO;if(!db.shop.ejs||!db.shop.ejs.pk)db.shop.ejs={...DEF_EJS};got('shop')},fbErr))}

async function hs(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bcc'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}

const live=()=>db.bills.filter(b=>!b.cancelled);
function cogsOf(b){return b.items.reduce((a,i)=>a+i.qty*(i.cost||0),0)}
function profitOf(b){return b.total-cogsOf(b)}
function soldMap(){const m={};live().forEach(b=>b.items.forEach(i=>m[i.pid]=(m[i.pid]||0)+i.qty));return m}
function stockOf(p,m){m=m||soldMap();return p.svc?Infinity:(+p.open||0)+(p.ins||[]).reduce((a,x)=>a+x.qty,0)+db.purchases.filter(x=>x.pid===p.id).reduce((a,x)=>a+x.qty,0)-(m[p.id]||0)}
function bal(cid){return live().filter(b=>b.cid===cid).reduce((a,b)=>a+b.total-b.paid,0)-db.pays.filter(p=>p.cid===cid).reduce((a,p)=>a+p.amt,0)}

 ask('New Purchase',[{k:'n',l:'Product',o:p?[p.name]:names},{k:'q',l:'Quantity',t:'number'},{k:'c',l:'Purchase price per unit ₹',t:'number',v:p?p.cost||'':''},{k:'sp',l:'Supplier (optional)'},{k:'d',l:'Date',t:'date',v:td()}],o=>{const q=+o.q,c=+o.c,pr=db.products.find(x=>x.name===o.n);if(!pr||!(q>0))return toast('Enter a valid quantity');if(o.c===''||!(c>=0))return toast('Enter the purchase price');
  put('purchases',{id:uid(),date:o.d||td(),pid:pr.id,name:pr.name,qty:q,cost:c,supplier:(o.sp||'').trim()});upd('products',pr.id,{cost:c});toast('Purchase saved. Stock updated');if(tab==='pur')pl();else if(tab==='inv')inv()},'Save')}
function purchases(){const t=td();$('#main').innerHTML=`<h2>Purchases</h2><div class="row" style="margin:0 0 12px"><button class="btn or" onclick="buy()">+ New Purchase</button><button class="btn ghost" onclick="newProd(purchases)">+ Add Product</button></div><div class="card"><div class="g"><label>From<input type="date" id="u1" value="${t.slice(0,8)}01" onchange="pl()"></label><label>To<input type="date" id="u2" value="${t}" onchange="pl()"></label></div></div><div id="pls"></div>`;pl()}
function pl(){const L=db.purchases.filter(x=>x.date>=$('#u1').value&&x.date<=$('#u2').value).sort((a,b)=>b.date.localeCompare(a.date)),T=L.reduce((a,x)=>a+x.qty*x.cost,0);
 $('#pls').innerHTML=`<div class="card"><b>Total purchases: ${inr(T)}</b></div>`+(L.map(x=>`<div class="card item"><div><b>${esc(x.name)}</b> × ${x.qty}<br><small>${dfmt(x.date)} · ${inr(x.cost)} each${x.supplier?' · '+esc(x.supplier):''}</small></div><div class="row" style="margin:0"><b>${inr(x.qty*x.cost)}</b><button class="btn sm rd" onclick="delPur('${x.id}')">✕</button></div></div>`).join('')||'<div class="card">No purchases in this period</div>')}
function delPur(id){const x=db.purchases.find(y=>y.id===id),p=db.products.find(y=>y.id===x.pid);if(p&&stockOf(p)-x.qty<0)return toast('Cannot delete: this stock has already been sold');conf('Delete this purchase? Stock will reduce.',()=>{rmv('purchases',id);pl()})}
function editProd(id){const p=db.products.find(x=>x.id===id);ask('Edit Product',[{k:'n',l:'Name',v:p.name},{k:'p',l:'Selling Price',v:p.price,t:'number'},{k:'c',l:'Purchase Price',v:p.cost||0,t:'number'},{k:'m',l:'Low-stock alert at',v:p.min||3,t:'number'}],o=>{if(!o.n.trim())return;upd('products',id,{name:o.n.trim(),price:+o.p||0,cost:+o.c||0,min:+o.m||3});inv()})}
function delProd(id){if(db.bills.some(b=>b.items.some(i=>i.pid===id)))return toast('Bills already exist for this product, so it cannot be deleted');conf('Delete this product?',()=>{rmv('products',id);inv()})}
/* ---------- credit ledger ---------- */
function cust(){$('#main').innerHTML=`<h2>Credit Ledger</h2>${db.customers.map(c=>({c,b:bal(c.id)})).sort((x,y)=>y.b-x.b).map(({c,b})=>`<div class="card item"><div><b>${esc(c.name)}</b><br><small>${esc(c.phone||'')}</small><br><b class="${b>0?'neg':'pos'}">${b<0?inr(-b)+' (Advance)':b>0?'Due: '+inr(b):'Settled'}</b></div><div class="row" style="margin:0"><button class="btn sm" onclick="stmt('${c.id}')">Statement</button>${b>0?`<button class="btn sm or" onclick="recv('${c.id}')">Receive Payment</button>`:''}</div></div>`).join('')||'<div class="card">No customers yet</div>'}`}
function recv(cid){const c=db.customers.find(x=>x.id===cid),b=bal(cid);ask(`Receive Payment — ${esc(c.name)} (Balance ${inr(b)})`,[{k:'a',l:'Amount ₹',t:'number'},{k:'d',l:'Date',t:'date',v:td()},{k:'n',l:'Note (Cash/UPI)'}],o=>{const a=+o.a;if(!(a>0))return toast('Enter amount');if(a>b+0.001)return toast('Amount cannot exceed the balance');put('pays',{id:uid(),cid,date:o.d||td(),amt:a,note:o.n||''});cust();toast('Payment recorded')},'Save')}
function stmt(cid){const c=db.customers.find(x=>x.id===cid);let e=[];live().filter(b=>b.cid===cid).forEach(b=>{e.push({d:b.date,t:'Bill '+b.no,dr:b.total,cr:b.paid})});db.pays.filter(p=>p.cid===cid).forEach(p=>e.push({d:p.date,t:'Payment '+(p.note||''),dr:0,cr:p.amt,pid:p.id}));e.sort((a,b)=>a.d.localeCompare(b.d));let r=0;
 modal(`<h3>Statement — ${esc(c.name)}</h3><div class="tw"><table><tr><th>Date</th><th>Detail</th><th>Debit</th><th>Credit</th><th>Balance</th></tr>${e.map(x=>{r+=x.dr-x.cr;return`<tr><td>${dfmt(x.d)}</td><td>${esc(x.t)}</td><td>${x.dr?inr(x.dr):''}</td><td>${x.cr?inr(x.cr):''}</td><td><b>${inr(r)}</b></td></tr>`}).join('')}</table></div><div class="row"><button class="btn ghost" onclick="closeM()">Close</button></div>`,1)}
/* ---------- reports ---------- */
function rep(){const t=td();$('#main').innerHTML=`<h2>Sales Report</h2><div class="card"><div class="g"><label>From<input type="date" id="r1" value="${t.slice(0,8)}01" onchange="rr()"></label><label>To<input type="date" id="r2" value="${t}" onchange="rr()"></label><label>Group<select id="rg" onchange="rr()"><option value="10">Day wise</option><option value="7">Month wise</option><option value="4">Year wise</option></select></label></div><div class="row"><button class="btn sm ghost" onclick="qd(0)">Today</button><button class="btn sm ghost" onclick="qd(1)">This Month</button><button class="btn sm ghost" onclick="qd(2)">This Year</button><button class="btn sm ghost" onclick="qd(3)">All</button></div></div><div id="rs"></div>`;rr()}
function qd(k){const t=td();$('#r1').value=[t,t.slice(0,8)+'01',t.slice(0,4)+'-01-01','2000-01-01'][k];$('#r2').value=t;if(k==2)$('#rg').value=7;if(k==3)$('#rg').value=4;rr()}
function rr(){const a=$('#r1').value,z=$('#r2').value,n=+$('#rg').value,M={};const get=k=>M[k]=M[k]||{n:0,s:0,c:0,g:0,r:0,e:0};
 live().filter(b=>b.date>=a&&b.date<=z).forEach(b=>{const x=get(b.date.slice(0,n));x.n++;x.s+=b.total;x.c+=b.total-b.paid;x.g+=cogsOf(b)});
 db.pays.filter(p=>p.date>=a&&p.date<=z).forEach(p=>get(p.date.slice(0,n)).r+=p.amt);db.exps.filter(p=>p.date>=a&&p.date<=z).forEach(p=>get(p.date.slice(0,n)).e+=p.amt);
 const K=Object.keys(M).sort(),T={n:0,s:0,c:0,g:0,r:0,e:0};K.forEach(k=>{for(const f in T)T[f]+=M[k][f]});
 const pur=db.purchases.filter(p=>p.date>=a&&p.date<=z).reduce((x,p)=>x+p.qty*p.cost,0),gp=T.s-T.g,np=gp-T.e,mg=T.s?Math.round(np/T.s*1000)/10:0;
 const cl=v=>v<0?'neg':'pos',row=(k,x,b)=>`<tr ${b?'style="font-weight:700;background:var(--bg)"':''}><td>${k}</td><td>${x.n}</td><td>${inr(x.s)}</td><td>${inr(x.g)}</td><td class="${cl(x.s-x.g)}">${inr(x.s-x.g)}</td><td>${inr(x.e)}</td><td class="${cl(x.s-x.g-x.e)}">${inr(x.s-x.g-x.e)}</td></tr>`;
 const pr=(l,v,b,c)=>`<tr ${b?'style="font-weight:700;background:var(--bg)"':''}><td>${l}</td><td style="text-align:right" class="${c||''}">${v}</td></tr>`;
 $('#rs').innerHTML=`<div class="stats"><div class="st"><small>Total Sales</small><b>${inr(T.s)}</b></div><div class="st"><small>Gross Profit</small><b>${inr(gp)}</b></div><div class="st"><small>Expenses</small><b>${inr(T.e)}</b></div><div class="st"><small>Net Profit</small><b>${inr(np)}</b></div><div class="st"><small>Credit Given</small><b>${inr(T.c)}</b></div></div>
 <div class="card tw"><h3>Profit &amp; Loss Statement</h3><table>${pr('Sales (after discount)',inr(T.s))}${pr('Less: Cost of goods sold',inr(T.g))}${pr('Gross Profit',inr(gp),1,cl(gp))}${pr('Less: Expenses',inr(T.e))}${pr(np<0?'Net Loss':'Net Profit',inr(np),1,cl(np))}${pr('Profit margin',mg+'%')}${pr('Stock purchased in this period (info)',inr(pur))}${pr('Credit recovered (info)',inr(T.r))}</table></div>
 <div class="card tw"><table><tr><th>Period</th><th>Bills</th><th>Sales</th><th>Cost</th><th>Gross Profit</th><th>Expenses</th><th>Net Profit</th></tr>${K.map(k=>row(n==10?dfmt(k):k.split('-').reverse().join('-'),M[k])).join('')}${row('TOTAL',T,1)}</table></div>`}
/* ---------- expenses ---------- */
function exp(){const t=td();$('#main').innerHTML=`<h2>Expenses</h2><div class="card"><div class="g"><label>Date<input type="date" id="ed" value="${t}"></label><label>Category<input id="ec" list="cats" placeholder="Rent, Electricity, Salary..."><datalist id="cats">${['Rent','Electricity','Salary','Tea and Snacks','Transport','Maintenance','Other'].map(x=>`<option>${x}</option>`).join('')}</datalist></label><label>Amount ₹<input id="ea" type="number" min="0"></label><label>Note<input id="en"></label></div><div class="row"><button class="btn" onclick="addExp()">+ Add Expense</button></div></div><div class="card"><div class="g"><label>From<input type="date" id="x1" value="${t.slice(0,8)}01" onchange="xl()"></label><label>To<input type="date" id="x2" value="${t}" onchange="xl()"></label></div><div class="tw" id="xl"></div></div>`;xl()}
function addExp(){const a=+$('#ea').value;if(!(a>0))return toast('Enter amount');put('exps',{id:uid(),date:$('#ed').value||td(),cat:$('#ec').value.trim()||'Other',amt:a,note:$('#en').value.trim()});exp();toast('Expense saved')}
function xl(){const L=db.exps.filter(e=>e.date>=$('#x1').value&&e.date<=$('#x2').value).sort((a,b)=>b.date.localeCompare(a.date));$('#xl').innerHTML=`<table><tr><th>Date</th><th>Category</th><th>Note</th><th>Amount</th><th></th></tr>${L.map(e=>`<tr><td>${dfmt(e.date)}</td><td>${esc(e.cat)}</td><td>${esc(e.note)}</td><td>${inr(e.amt)}</td><td><button class="btn sm rd" onclick="delExp('${e.id}')">✕</button></td></tr>`).join('')}<tr style="font-weight:700"><td colspan="3">Total</td><td>${inr(L.reduce((a,e)=>a+e.amt,0))}</td><td></td></tr></table>`}
function delExp(id){conf('Delete this expense?',()=>{rmv('exps',id);xl()})}
/* ---------- settings ---------- */
function settings(){const s=db.shop,e=s.ejs;$('#main').innerHTML=`<h2>Settings</h2><p style="color:var(--mu)">${fs?'🟢 Online mode: data is synced live on all devices.':'🟠 Offline mode: data is saved on this device only.'}</p><div class="card"><h3>Shop Details (printed on bills)</h3><div class="g"><label>Shop Name<input id="sn" value="${esc(s.name)}"></label><label>Mobile<input id="sp" value="${esc(s.phone)}"></label><label>Email<input id="se" value="${esc(s.email)}"></label><label>Address<input id="sa" value="${esc(s.addr)}"></label><label>Logo (image file)<input type="file" id="sl" accept="image/*" onchange="logoUp(this)"></label></div><div class="row">${logoImg(50)}<button class="btn" onclick="saveShop()">Save</button></div></div>
 <div class="card"><h3>Email Setup (EmailJS)</h3><p style="color:var(--mu);font-size:13px">Create a free account at emailjs.com → connect an Email Service → create a Template (To: <code>{{to_email}}</code>, body: <code>{{{bill_html}}}</code>) → enter the 3 values below.</p><div class="g"><label>Public Key<input id="ek" value="${esc(e.pk)}"></label><label>Service ID<input id="es" value="${esc(e.sid)}"></label><label>Template ID<input id="et" value="${esc(e.tid)}"></label></div><div class="row"><button class="btn" onclick="saveEj()">Save</button></div></div>
 <div class="card"><h3>Backup / Restore</h3><div class="row"><button class="btn ghost" onclick="bk()">View Backup</button><button class="btn ghost" onclick="rs()">Restore</button><button class="btn ghost" onclick="pw()">Change Password</button></div></div>`}
function logoUp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);db.shop.logo=c.toDataURL('image/png');putShop();start();nav('set');toast('Logo updated')};im.src=r.result};r.readAsDataURL(f)}
function saveShop(){Object.assign(db.shop,{name:$('#sn').value.trim()||'Balwa Car Cool',phone:$('#sp').value.trim(),email:$('#se').value.trim(),addr:$('#sa').value.trim()});putShop();start();nav('set');toast('Saved')}
function saveEj(){db.shop.ejs={pk:$('#ek').value.trim(),sid:$('#es').value.trim(),tid:$('#et').value.trim()};putShop();toast('Email setup saved')}
function bk(){modal(`<h3>Backup</h3><p style="font-size:13px;color:var(--mu)">Copy this whole text and keep it safe (WhatsApp / Notes).</p><textarea rows="8" id="bkt" readonly onclick="this.select()">${esc(JSON.stringify(db))}</textarea><div class="row"><button class="btn ghost" onclick="closeM()">Close</button></div>`)}
function rs(){modal(`<h3>Restore</h3><textarea rows="8" id="rst" placeholder="Paste backup text here"></textarea><div class="row"><button class="btn rd" onclick="doRs()">Restore</button><button class="btn ghost" onclick="closeM()">Cancel</button></div>`)}
function doRs(){if(fs)return toast('Restore is available in offline mode only');try{const d=JSON.parse($('#rst').value);if(!d.products||!d.bills)throw 0;db=d;save();load();closeM();start();toast('Data restored')}catch(e){toast('Invalid backup text')}}
function pw(){ask('Change Password',[{k:'p',l:'New Password',t:'password'}],async o=>{if(o.p.length<4)return toast('At least 4 characters');if(fs){try{await auth.currentUser.updatePassword(o.p);return toast('Password changed')}catch(e){return toast('Please log in again, then retry')}}db.user.h=await hs(o.p);save();toast('Password changed')})}
/* ---------- boot ---------- */
load();initFB();
if(fs){auth.onAuthStateChanged(u=>{if(u)sync();else{unsub();showLogin()}})}
else{let _in=0;try{_in=sessionStorage.getItem('bcc_in')}catch(e){}if(_in&&db.user)start();else showLogin()}
</script></body></html>
